# 三 UID、九模块 —— 权限设计的参照模型（对应 handoff.md §5.2）。
#
# 这里同时给出了配套的目录布局与权限，因为"配置文件本身不提供任何保护"：
# 真正的强制边界是文件系统权限，库内的 UID 自检只是防误用。
#
# 准备命令（由受信任的启动流程以 root 执行一次）：
#
#   groupadd ipc-members
#   install -d -o root -g ipc-members -m 0750 /run/example-ipc
#   install -d -o 1001 -g ipc-members -m 0750 /run/example-ipc/A
#   install -d -o 1002 -g ipc-members -m 0750 /run/example-ipc/B
#   install -d -o 1003 -g ipc-members -m 0750 /run/example-ipc/C
#   install -o root -g root -m 0644 03-three-uid-nine-modules.conf /etc/ipc-modules.conf
#
# 三个服务身份 1001/1002/1003 都要是 ipc-members 的成员。
#
# 权限矩阵：
#   /run/example-ipc            root:ipc-members  0750   非组成员进不来
#   /run/example-ipc/A          1001:ipc-members  0750   别的服务不能在这里建/删/换
#   /run/example-ipc/A/A1.sock  1001:ipc-members  0620   组内可写 → 跨 UID 能发
#   /etc/ipc-modules.conf       root:root         0644   服务改不了策略
#
# 注意：
#   * socket 文件的权限由库在 bind 之后**显式设置**（不是靠 umask 蒙的），
#     并且会 lstat 回读校验。因为 fchmod/fchown 对已 bind 的 unix socket fd
#     是静默 no-op，必须走路径形式。
#   * 组身份不会自动决定新建文件的属组，所以 socket 的组要么由库显式设置，
#     要么靠 setgid 目录。见 examples/README.md 第 7 节待定项 1。
#
# 格式：<ns> <moduleId> <uid> <path>

# ---- A 组 ----
core  A1  1001  /run/example-ipc/A/A1.sock
core  A2  1001  /run/example-ipc/A/A2.sock
core  A3  1001  /run/example-ipc/A/A3.sock

# ---- B 组 ----
core  B1  1002  /run/example-ipc/B/B1.sock
core  B2  1002  /run/example-ipc/B/B2.sock
core  B3  1002  /run/example-ipc/B/B3.sock

# ---- C 组 ----
core  C1  1003  /run/example-ipc/C/C1.sock
core  C2  1003  /run/example-ipc/C/C2.sock
core  C3  1003  /run/example-ipc/C/C3.sock
