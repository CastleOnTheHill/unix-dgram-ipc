# 反例：uid 不是纯十进制数字 —— 整表被拒（IPC_ERR_CONFIG）。
#
# 这是最常见的写法错误：拿用户名当 uid 填。
# 只接受十进制数字，且不接受 '+'、'-'、前导空格、科学计数法。
#   坏的：logger  -1  +1001  1e3  0x3e9  1001abc
#   好的：0  1001  1501
#
# 为什么不用名字：那要查 passwd，解析结果受 NSS 配置影响（LDAP/NIS 不在时
# 行为不同），而且配错时更难发现 —— 数字是明确的。

demo  Sender  1001    /run/demo-ipc/Sender.sock
demo  Logger  logger  /run/demo-ipc/Logger.sock
