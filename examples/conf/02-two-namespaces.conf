# 演示 namespace 的作用：同一台机器上两套部署各有一个同名模块。
#
# "Logger" 和 "Camera" 各出现两次，分属两个命名空间，互不影响：
#   - 两套部署的 socket 路径本来就不同（路径全机唯一，配置会强制这一点）；
#   - 广播只在本命名空间内展开，vehicle 的模块不会收到 cabin 的广播。
#
# 重要：这种情况下注册**必须显式指定 ns**。
# 只给 moduleId = "Logger" 而不给 ns，库会发现这个名字在两处都出现，
# 报 IPC_ERR_CONFIG（歧义）—— 宁可直接失败，也不替调用方猜。
#
#   示例： opts.moduleId = "Logger";
#          opts.ns       = "vehicle";   /* 不给就报 IPC_ERR_CONFIG */

# ---- 车载这套（团队 A）----
vehicle  Logger    2001  /run/vehicle-ipc/Logger.sock
vehicle  Camera    2001  /run/vehicle-ipc/Camera.sock

# ---- 座舱这套（团队 B）----
cabin    Logger    2002  /run/cabin-ipc/Logger.sock
cabin    Camera    2002  /run/cabin-ipc/Camera.sock
