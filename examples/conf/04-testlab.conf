# 自测用配置：**不是生产配置**。
#
# 用途：把库单独跑起来做功能验证。路径全部落在 $IPC_LAB 之下，
# 跑完连目录一起删，不碰生产模块地址。
# 默认 $IPC_LAB=/opt/ipc-lab。下面把 /opt/ipc-lab 直接写死以便阅读，
# 实际生成时按 setup 脚本展开。
#
# 两类身份各来一组：
#   - uid 0    ：root 直接跑的实例（做正常路径、拥塞、协议健壮性等测试）
#   - uid 1501/1502/1503 ：降权跑的实例，用来验证跨 UID 的凭据校验
#   - uid 1504 ：在组外，用来验证"非组成员发不进来"
#
# 校验要点（每条 Q 都对应一个测试）：
#   * 库的 UID 自检会比对 real UID / effective UID / 这里配置的 uid；
#   * 接收侧的真正依据是内核给的 SCM_CREDENTIALS，不是报文自称的 src；
#   * root 属于单独的信任边界，不要用它去"证明"跨 UID 保护有效。
#
# 格式：<ns> <moduleId> <uid> <path>

# ---- root 实例 ----
lab  TestRoot0   0  /opt/ipc-lab/run/root/testmod-0.sock
lab  TestRoot1   0  /opt/ipc-lab/run/root/testmod-1.sock

# ---- 降权实例，三个 UID 同属通信组 ipcmembers ----
lab  TestA       1501  /opt/ipc-lab/run/A/testmod-A.sock
lab  TestB       1502  /opt/ipc-lab/run/B/testmod-B.sock
lab  TestC       1503  /opt/ipc-lab/run/C/testmod-C.sock

# ---- 组外身份：故意不在 ipcmembers 里，用来验证权限确实拦得住 ----
lab  TestX       1504  /opt/ipc-lab/run/X/testmod-X.sock

# ---- 歧义测试：同一个模块名 TestA 出现在第二个命名空间 ----
# 注册时不指定 ns 会得到 IPC_ERR_CONFIG；指定了才能注册。
extra  TestA     1503  /opt/ipc-lab/run/C/extra-TestA.sock
