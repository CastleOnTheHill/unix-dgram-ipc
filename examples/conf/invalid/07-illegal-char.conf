# 反例：名字里有非法字符 —— 整表被拒（IPC_ERR_CONFIG）。
#
#   moduleId ：只允许字母、数字、'_'、'-'、'.'
#   ns       ：只允许字母、数字、'_'、'-'（比 moduleId 少一个 '.'）
#
# 收窄字符集是为了让名字能安全地出现在日志、journal 行、脚本变量和文件路径里，
# 不需要再做转义。'@' 不在允许集合里。
#
# 顺带一提：'#' 也不允许，但它更早就被当成行内注释截断了，轮不到字符校验。
# 同样的规则也适用于 ns，例如 "co/re" 里的 '/' 非法。

demo  A1@2  1001  /run/demo-ipc/A12.sock
