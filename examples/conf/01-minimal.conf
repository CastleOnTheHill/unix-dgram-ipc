# 最小可用配置：一个命名空间、一个 UID、两个模块。
#
# 格式：<ns> <moduleId> <uid> <path>          （每行恰好 4 个字段）
#       '#' 到行尾是注释，支持行内注释；空行忽略。
#
# 用法：把本文件的路径传给 IpcModuleOptions.confPath，
#       或者直接 IpcConfigLoad("01-minimal.conf", &cfg)。

demo  Sender    1001  /run/demo-ipc/Sender.sock
demo  Receiver  1001  /run/demo-ipc/Receiver.sock
